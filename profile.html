<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RetroHub • Perfil de Usuario</title>
  
  <!-- Tipografías Oficiales de RetroHub (Space Grotesk & Outfit) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Estilos Unificados del Sistema RetroHub OS -->
  <link rel="stylesheet" href="IisuProfile.css">
  
  <!-- React 18 y Babel Standalone para renderizado directo en navegador -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="iisu_cursor.js"></script>
</head>
<body class="profile-body">
  <!-- Contenedor Raíz de React -->
  <div id="profileRoot"></div>

  <!-- Componente React RetroHubProfileApp -->
  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // PALETAS DE AURA BIOLUMINISCENTE RETROHUB
    const AURA_PALETTES = {
      mint: { id: 'mint', name: 'Mint Cyan', color: '#00d2be', glow: 'rgba(0, 210, 190, 0.45)' },
      scarlet: { id: 'scarlet', name: 'Joy-Con Scarlet', color: '#ff3c28', glow: 'rgba(255, 60, 40, 0.45)' },
      electric: { id: 'electric', name: 'Electric Blue', color: '#00a2ed', glow: 'rgba(0, 162, 237, 0.45)' },
      neon: { id: 'neon', name: 'Neon Purple', color: '#818cf8', glow: 'rgba(129, 140, 248, 0.45)' },
      gold: { id: 'gold', name: 'Retro Gold', color: '#f59e0b', glow: 'rgba(245, 158, 11, 0.45)' }
    };

    // AVATARES DE STOCK (PORTADAS REALES, HARDWARE Y PERSONAJES)
    const STOCK_AVATARS = [
      { id: 'av_paper', name: 'Paper Mario', url: 'ROMS/covers/papermario.png', type: 'covers' },
      { id: 'av_3weeks', name: '3 Weeks in Paradise', url: 'ROMS/covers/3weeksinparadise.jpg', type: 'covers' },
      { id: 'av_anguna', name: 'Anguna', url: 'ROMS/covers/anguna_box.png', type: 'covers' },
      { id: 'av_31in1', name: '31-in-1 Real Game', url: 'ROMS/covers/31in1.png', type: 'covers' },
      { id: 'av_3in1', name: '3-in-1 2-P-Pak', url: 'ROMS/covers/3in1.png', type: 'covers' },
      { id: 'av_n64', name: 'Nintendo 64', url: 'assets/consoles_hires/n64.png', type: 'consoles' },
      { id: 'av_gba', name: 'Game Boy Advance', url: 'assets/consoles_hires/gba.png', type: 'consoles' },
      { id: 'av_nes', name: 'NES', url: 'assets/consoles/nes.png', type: 'consoles' },
      { id: 'av_snes', name: 'Super Nintendo', url: 'assets/consoles_hires/snes.png', type: 'consoles' },
      { id: 'av_ps1', name: 'PlayStation 1', url: 'assets/consoles_hires/ps1.png', type: 'consoles' },
      { id: 'av_bot_himawari', name: 'Himawari Bot', url: 'https://api.dicebear.com/7.x/bottts/svg?seed=SaraHimawari', type: 'characters' },
      { id: 'av_bot_retro', name: 'Retro Gamer', url: 'https://api.dicebear.com/7.x/bottts/svg?seed=SaraRetro', type: 'characters' },
      { id: 'av_bot_pixel', name: 'Pixel Hero', url: 'https://api.dicebear.com/7.x/pixel-art/svg?seed=RetroHubHero', type: 'characters' }
    ];

    // BANNERS PANORÁMICOS DE STOCK
    const STOCK_BANNERS = [
      { id: 'bn_paper', name: 'Paper Mario Kingdom (N64)', url: 'assets/game_wallpapers/n64/papermario.png' },
      { id: 'bn_sm64', name: 'Super Mario 64 Castle (N64)', url: 'assets/game_wallpapers/n64/sm64.png' },
      { id: 'bn_oot', name: 'Zelda Ocarina of Time (N64)', url: 'assets/game_wallpapers/n64/oot.png' },
      { id: 'bn_smw', name: 'Super Mario World (SNES)', url: 'assets/game_wallpapers/snes/smw.png' },
      { id: 'bn_emerald', name: 'Pokémon Esmeralda (GBA)', url: 'assets/game_wallpapers/gba/pokemon_emerald.png' },
      { id: 'bn_n64_art', name: 'Nintendo 64 Matrix', url: 'assets/wallpapers/n64.svg' },
      { id: 'bn_gba_art', name: 'Game Boy Advance Indigo', url: 'assets/wallpapers/gba.svg' }
    ];

    function RetroHubProfileApp() {
      // Pestaña activa ('perfil', 'amigos', 'ajustes', 'logros')
      const [activeTab, setActiveTab] = useState(() => {
        const p = new URLSearchParams(window.location.search);
        return p.get('tab') || 'perfil';
      });

      // Estado de carga inicial
      const [isLoading, setIsLoading] = useState(true);

      // Datos reales del perfil del usuario autenticado
      const [profile, setProfile] = useState({
        id: null,
        username: localStorage.getItem('retrohub_user_name') || 'himawari',
        displayName: localStorage.getItem('retrohub_display_name') || localStorage.getItem('retrohub_user_name') || 'himawari',
        bio: localStorage.getItem('retrohub_user_bio') || '',
        avatarUrl: localStorage.getItem('retrohub_user_avatar') || 'https://api.dicebear.com/7.x/bottts/svg?seed=SaraHimawari',
        bannerUrl: localStorage.getItem('retrohub_user_banner') || 'assets/game_wallpapers/n64/papermario.png',
        titleHonor: localStorage.getItem('retrohub_honor_title') || '🎮 Maestro de los 64-Bits',
        systemAura: localStorage.getItem('retrohub_aura_id') || 'mint',
        favoriteSystem: localStorage.getItem('retrohub_fav_system') || 'n64',
        friendCode: '',
        socialLinks: [
          { id: 'l1', platform: 'discord', title: 'Discord', url: 'https://discord.gg/retrohub', icon: '💬' }
        ],
        presence: { status: 'online', game: null }
      });

      // Actividad de juego real (sin mocks hardcodeados)
      const [playActivity, setPlayActivity] = useState([]);
      // Amigos reales (sin mocks hardcodeados)
      const [friends, setFriends] = useState([]);
      const [addFriendInput, setAddFriendInput] = useState('');
      const [clockText, setClockText] = useState('12:00');

      // Modales y retroalimentación
      const [showQrModal, setShowQrModal] = useState(false);
      const [toast, setToast] = useState(null);
      const [avatarTabFilter, setAvatarTabFilter] = useState('covers');
      const [isSaving, setIsSaving] = useState(false);
      const [isOwner, setIsOwner] = useState(true);

      // Validación de nombre de usuario en tiempo real
      const [usernameInput, setUsernameInput] = useState(profile.username);
      const [usernameValidation, setUsernameValidation] = useState({ status: 'available', message: '✓ Confirmado' });
      const debounceTimerRef = useRef(null);
      const fileInputRef = useRef(null);
      const broadcastRef = useRef(null);

      // Inicialización y carga de datos reales
      useEffect(() => {
        // 1. Reloj en tiempo real
        const updateClock = () => {
          const now = new Date();
          const hh = String(now.getHours()).padStart(2, '0');
          const mm = String(now.getMinutes()).padStart(2, '0');
          setClockText(`${hh}:${mm}`);
        };
        updateClock();
        const clockTimer = setInterval(updateClock, 1000);

        // 2. Cargar Play Activity real de localStorage
        try {
          const storedAct = localStorage.getItem('retrohub_play_activity');
          if (storedAct) {
            const parsed = JSON.parse(storedAct);
            if (Array.isArray(parsed)) {
              setPlayActivity(parsed);
            }
          }
        } catch (e) {
          setPlayActivity([]);
        }

        // 3. Determinar usuario a consultar (vía parámetro ?user= o sesión actual JWT)
        const params = new URLSearchParams(window.location.search);
        const targetUser = params.get('user') || params.get('username');
        const token = localStorage.getItem('retrohub_jwt_token');

        let fetchUrl = '/api/users/profile';
        const fetchHeaders = {};
        if (token) {
          fetchHeaders['Authorization'] = `Bearer ${token}`;
        }

        if (targetUser) {
          fetchUrl = `/api/users/profile/${encodeURIComponent(targetUser.trim().toLowerCase())}`;
          const currentLogged = localStorage.getItem('retrohub_user_name');
          if (currentLogged && currentLogged.toLowerCase() !== targetUser.trim().toLowerCase()) {
            setIsOwner(false);
          }
        }

        // 4. Obtener datos del perfil desde el servidor RetroHub
        fetch(fetchUrl, { headers: fetchHeaders })
          .then(r => r.json())
          .then(data => {
            if (data.success && data.user) {
              const u = data.user;
              const userId = u.id;
              
              // Cargar o generar Clave de Amigo única vinculada al usuario
              let fcKey = `retrohub_friend_code_${userId}`;
              let fc = localStorage.getItem(fcKey) || localStorage.getItem('retrohub_friend_code');
              if (!fc || !fc.startsWith('SW-')) {
                const p1 = Math.floor(1000 + Math.random() * 9000);
                const p2 = Math.floor(1000 + Math.random() * 9000);
                const p3 = Math.floor(1000 + Math.random() * 9000);
                fc = `SW-${p1}-${p2}-${p3}`;
                localStorage.setItem(fcKey, fc);
                localStorage.setItem('retrohub_friend_code', fc);
              }

              const newAura = u.systemAura || 'mint';
              setProfile(p => ({
                ...p,
                id: userId,
                username: u.username || p.username,
                displayName: u.displayName || u.username || p.displayName,
                bio: u.bio !== undefined ? u.bio : p.bio,
                avatarUrl: u.avatarUrl || p.avatarUrl,
                bannerUrl: u.bannerUrl || p.bannerUrl,
                titleHonor: u.titleHonor || p.titleHonor,
                systemAura: newAura,
                favoriteSystem: u.favoriteSystem || p.favoriteSystem,
                socialLinks: u.socialLinks && u.socialLinks.length ? u.socialLinks : p.socialLinks,
                friendCode: fc,
                presence: u.presence || { status: 'online', game: null }
              }));

              setUsernameInput(u.username || p.username);

              // Aplicar paleta de Aura dinámica
              const aura = AURA_PALETTES[newAura] || AURA_PALETTES.mint;
              document.documentElement.style.setProperty('--system-aura-color', aura.color);
              document.documentElement.style.setProperty('--system-aura-glow', aura.glow);

              // Almacenar datos básicos de sesión si somos propietarios
              if (!targetUser || targetUser.toLowerCase() === (u.username || '').toLowerCase()) {
                localStorage.setItem('retrohub_user_name', u.username);
                if (u.displayName) localStorage.setItem('retrohub_display_name', u.displayName);
                if (u.avatarUrl) localStorage.setItem('retrohub_user_avatar', u.avatarUrl);
                if (u.bannerUrl) localStorage.setItem('retrohub_user_banner', u.bannerUrl);
                if (u.bio) localStorage.setItem('retrohub_user_bio', u.bio);
                if (u.titleHonor) localStorage.setItem('retrohub_honor_title', u.titleHonor);
                if (newAura) localStorage.setItem('retrohub_aura_id', newAura);
                if (u.favoriteSystem) localStorage.setItem('retrohub_fav_system', u.favoriteSystem);
              }
            }
          })
          .catch(() => {
            // Si no hay respuesta o falla, usar valores locales seguros
            let fc = localStorage.getItem('retrohub_friend_code') || 'SW-4829-1092-4821';
            setProfile(p => ({ ...p, friendCode: fc }));
          })
          .finally(() => {
            setIsLoading(false);
          });

        // 5. Canal de sincronización en tiempo real (BroadcastChannel)
        if (typeof BroadcastChannel !== 'undefined') {
          broadcastRef.current = new BroadcastChannel('retrohub_profile_sync');
          broadcastRef.current.onmessage = (event) => {
            if (event.data && event.data.type === 'PLAY_ACTIVITY_UPDATED') {
              setPlayActivity(event.data.activity);
            }
          };
        }

        return () => {
          clearInterval(clockTimer);
          if (broadcastRef.current) broadcastRef.current.close();
        };
      }, []);

      // Cambiar de Aura en vivo
      const handleSelectAura = (auraKey) => {
        const aura = AURA_PALETTES[auraKey];
        if (!aura) return;
        setProfile(p => ({ ...p, systemAura: auraKey }));
        document.documentElement.style.setProperty('--system-aura-color', aura.color);
        document.documentElement.style.setProperty('--system-aura-glow', aura.glow);
        localStorage.setItem('retrohub_aura_id', auraKey);
        localStorage.setItem('retrohub_aura_color', aura.color);
        localStorage.setItem('retrohub_aura_glow', aura.glow);

        if (broadcastRef.current) {
          broadcastRef.current.postMessage({
            type: 'PROFILE_UPDATED',
            systemAura: auraKey,
            systemAuraColor: aura.color,
            systemAuraGlow: aura.glow
          });
        }
        showToast('info', `Aura cambiada a ${aura.name}.`);
      };

      // Cambiar avatar desde stock
      const handleSelectAvatar = (url) => {
        setProfile(p => ({ ...p, avatarUrl: url }));
        localStorage.setItem('retrohub_user_avatar', url);
        if (broadcastRef.current) {
          broadcastRef.current.postMessage({
            type: 'PROFILE_UPDATED',
            avatarUrl: url
          });
        }
        showToast('success', 'Foto de perfil seleccionada.');
      };

      // Cambiar banner
      const handleSelectBanner = (url) => {
        setProfile(p => ({ ...p, bannerUrl: url }));
        localStorage.setItem('retrohub_user_banner', url);
        showToast('success', 'Banner panorámico seleccionado.');
      };

      // Subida de imagen personalizada
      const handleFileUpload = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async () => {
          const base64 = reader.result;
          setProfile(p => ({ ...p, avatarUrl: base64 }));
          localStorage.setItem('retrohub_user_avatar', base64);
          if (broadcastRef.current) {
            broadcastRef.current.postMessage({
              type: 'PROFILE_UPDATED',
              avatarUrl: base64
            });
          }
          showToast('success', 'Foto personalizada cargada.');
        };
        reader.readAsDataURL(file);
      };

      // Copiar Clave de Amigo al Portapapeles
      const handleCopyFriendCode = () => {
        if (!profile.friendCode) return;
        navigator.clipboard.writeText(profile.friendCode).then(() => {
          showToast('success', `✓ ¡Clave ${profile.friendCode} copiada al portapapeles!`);
        }).catch(() => {
          showToast('info', `Tu clave: ${profile.friendCode}`);
        });
      };

      // Validación de usuario en tiempo real
      const handleUsernameChange = (e) => {
        const val = e.target.value;
        setUsernameInput(val);

        if (!val.trim()) {
          setUsernameValidation({ status: 'invalid', message: '⚠ El nombre no puede estar vacío.' });
          return;
        }
        if (val.length < 3 || val.length > 24) {
          setUsernameValidation({ status: 'invalid', message: '⚠ Entre 3 y 24 caracteres.' });
          return;
        }

        setUsernameValidation({ status: 'checking', message: '⟳ Comprobando disponibilidad...' });
        if (debounceTimerRef.current) clearTimeout(debounceTimerRef.current);
        debounceTimerRef.current = setTimeout(async () => {
          try {
            const res = await fetch(`/api/users/check-username/${encodeURIComponent(val.trim())}?excludeUserId=${profile.id || 0}`);
            const data = await res.json();
            if (data.available) {
              setUsernameValidation({ status: 'available', message: `✓ ¡@${val} está disponible!` });
            } else {
              setUsernameValidation({ status: 'taken', message: `✗ Ya en uso.` });
            }
          } catch {
            setUsernameValidation({ status: 'available', message: '✓ Formato válido.' });
          }
        }, 300);
      };

      // Añadir amigo por clave de amigo
      const handleAddFriendByCode = (e) => {
        e.preventDefault();
        const code = addFriendInput.trim().toUpperCase();
        if (!code || !code.startsWith('SW-') || code.length < 14) {
          showToast('error', 'Introduce una clave válida (ej: SW-1234-5678-9012).');
          return;
        }

        setAddFriendInput('');
        showToast('success', `¡Solicitud de amistad enviada a ${code}!`);
      };

      // Guardar perfil completo en SQLite y LocalStorage
      const handleSaveProfile = async () => {
        setIsSaving(true);
        const token = localStorage.getItem('retrohub_jwt_token');
        const payload = {
          userId: profile.id,
          username: usernameInput.trim() || profile.username,
          displayName: profile.displayName.trim() || profile.username,
          bio: profile.bio,
          avatarUrl: profile.avatarUrl,
          bannerUrl: profile.bannerUrl,
          titleHonor: profile.titleHonor,
          systemAura: profile.systemAura,
          favoriteSystem: profile.favoriteSystem,
          socialLinks: profile.socialLinks
        };

        const headers = { 'Content-Type': 'application/json' };
        if (token) headers['Authorization'] = `Bearer ${token}`;

        try {
          const res = await fetch('/api/users/profile', {
            method: 'PUT',
            headers: headers,
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          if (res.ok && data.success) {
            setProfile(p => ({
              ...p,
              username: payload.username,
              displayName: payload.displayName
            }));
            localStorage.setItem('retrohub_user_name', payload.username);
            localStorage.setItem('retrohub_display_name', payload.displayName);
            localStorage.setItem('retrohub_user_bio', payload.bio || '');
            localStorage.setItem('retrohub_user_avatar', payload.avatarUrl);
            localStorage.setItem('retrohub_user_banner', payload.bannerUrl);
            localStorage.setItem('retrohub_honor_title', payload.titleHonor);
            localStorage.setItem('retrohub_fav_system', payload.favoriteSystem);

            if (broadcastRef.current) {
              broadcastRef.current.postMessage({
                type: 'PROFILE_UPDATED',
                displayName: payload.displayName,
                username: payload.username,
                avatarUrl: payload.avatarUrl,
                systemAura: payload.systemAura
              });
            }
            showToast('success', '✓ Cambios guardados con éxito.');
          } else {
            showToast('error', data.error ? data.error.message : 'Error al guardar perfil.');
          }
        } catch {
          localStorage.setItem('retrohub_user_name', payload.username);
          localStorage.setItem('retrohub_display_name', payload.displayName);
          localStorage.setItem('retrohub_user_avatar', payload.avatarUrl);
          showToast('success', 'Perfil guardado localmente.');
        } finally {
          setIsSaving(false);
        }
      };

      // Formateador de tiempo al estilo consola
      const formatPlayTime = (minutes) => {
        if (!minutes || minutes < 60) return 'Jugado por primera vez';
        const hours = Math.floor(minutes / 60);
        return `Jugado durante ${hours} horas o más`;
      };

      // Toast feedback
      const showToast = (type, message) => {
        setToast({ type, message });
        setTimeout(() => setToast(null), 3800);
      };

      // Regresar al Launcher
      const handleReturnToLauncher = () => {
        if (window.opener && !window.opener.closed) {
          window.close();
        } else {
          window.location.href = 'index.html';
        }
      };

      const activeAuraData = AURA_PALETTES[profile.systemAura] || AURA_PALETTES.mint;

      return (
        <div className="retrohub-window-wrapper">
          <input
            type="file"
            ref={fileInputRef}
            style={{ display: 'none' }}
            accept="image/*"
            onChange={handleFileUpload}
          />

          {/* Orbes de resplandor ambiental RetroHub */}
          <div className="profile-ambient-orb profile-orb-1" style={{ background: activeAuraData.glow }} />
          <div className="profile-ambient-orb profile-orb-2" />
          <div className="profile-ambient-orb profile-orb-3" />

          {/* Toast Flotante */}
          {toast && (
            <div className={`retrohub-toast toast-${toast.type}`}>
              <span>{toast.type === 'success' ? '✓' : toast.type === 'error' ? '✗' : 'ℹ'}</span>
              <span>{toast.message}</span>
            </div>
          )}

          {/* VENTANA FLOTANTE PRINCIPAL RETROHUB */}
          <div className="retrohub-window">
            
            {/* BARRA LATERAL IZQUIERDA (SIDEBAR) */}
            <aside className="retrohub-sidebar">
              <div>
                {/* Branding Oficial RetroHub */}
                <div className="sidebar-brand">
                  <div className="brand-logo-box">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                      <path d="M7 2h-1a5 5 0 0 0-5 5v10a5 5 0 0 0 5 5h1a1 1 0 0 0 1-1V3a1 1 0 0 0-1-1zm-2 7a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm1 7H4v-2h2v2z"/>
                      <path d="M17 2h1a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5h-1a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1zm2 13a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm-1-7h2V6h-2v2z"/>
                    </svg>
                  </div>
                  <div className="brand-meta">
                    <span className="brand-title">RetroHub</span>
                    <span className="brand-sub">Gaming OS</span>
                  </div>
                </div>

                {/* Menú de Navegación Vertical */}
                <nav className="sidebar-nav" style={{ marginTop: '16px' }}>
                  <button
                    className={`nav-item ${activeTab === 'perfil' ? 'active' : ''}`}
                    onClick={() => setActiveTab('perfil')}
                  >
                    <div className="nav-item-inner">
                      <div className="nav-icon">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                          <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                      </div>
                      <span>Perfil</span>
                    </div>
                    <span className="nav-badge-pill">SW</span>
                  </button>

                  <button
                    className={`nav-item ${activeTab === 'amigos' ? 'active' : ''}`}
                    onClick={() => setActiveTab('amigos')}
                  >
                    <div className="nav-item-inner">
                      <div className="nav-icon">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                          <circle cx="9" cy="7" r="4"></circle>
                          <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                        </svg>
                      </div>
                      <span>Lista de amigos</span>
                    </div>
                    <span className="nav-badge-pill">{friends.length}</span>
                  </button>

                  {isOwner && (
                    <button
                      className={`nav-item ${activeTab === 'ajustes' ? 'active' : ''}`}
                      onClick={() => setActiveTab('ajustes')}
                    >
                      <div className="nav-item-inner">
                        <div className="nav-icon">
                          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                            <circle cx="12" cy="12" r="3"></circle>

                              <div
                                key={item.id}
                                className={`avatar-stock-item ${profile.avatarUrl === item.url ? 'active' : ''}`}
                                onClick={() => handleSelectAvatar(item.url)}
                                title={item.name}
                              >
                                <img src={item.url} className="avatar-stock-thumb" alt={item.name} />
                              </div>
                            ))}
                          </div>
                        </div>

                        {/* Selector de Banner Panorámico */}
                        <div>
                          <label className="form-label">Banner Panorámico</label>
                          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(105px, 1fr))', gap: '8px', marginTop: '8px' }}>
                            {STOCK_BANNERS.map(b => (
                              <div
                                key={b.id}
                                style={{
                                  height: '54px',
                                  borderRadius: '10px',
                                  overflow: 'hidden',
                                  border: profile.bannerUrl === b.url ? '2px solid var(--system-aura-color)' : '1.5px solid rgba(0,0,0,0.1)',
                                  cursor: 'pointer'
                                }}
                                onClick={() => handleSelectBanner(b.url)}
                                title={b.name}
                              >
                                <img src={b.url} style={{ width: '100%', height: '100%', objectFit: 'cover' }} alt={b.name} />
                              </div>
                            ))}
                          </div>
                        </div>
                      </div>

                      {/* Columna Derecha: Formulario de Información Personal */}
                      <div>
                        <div className="form-field-group">
                          <label className="form-label">Nombre de Usuario Único (@)</label>
                          <input
                            type="text"
                            className="form-text-input"
                            value={usernameInput}
                            maxLength={24}
                            onChange={handleUsernameChange}
                          />
                          <span style={{ fontSize: '11px', color: usernameValidation.status === 'taken' ? '#ff3c28' : 'var(--system-aura-color)', marginTop: '2px' }}>
                            {usernameValidation.message}
                          </span>
                        </div>

                        <div className="form-field-group">
                          <label className="form-label">Nombre Visible Público</label>
                          <input
                            type="text"
                            className="form-text-input"
                            value={profile.displayName}
                            maxLength={32}
                            onChange={(e) => setProfile(p => ({ ...p, displayName: e.target.value }))}
                          />
                        </div>

                        <div className="form-field-group">
                          <label className="form-label">Título Honorífico</label>
                          <input
                            type="text"
                            className="form-text-input"
                            value={profile.titleHonor}
                            maxLength={40}
                            onChange={(e) => setProfile(p => ({ ...p, titleHonor: e.target.value }))}
                          />
                        </div>

                        <div className="form-field-group">
                          <label className="form-label">Consola Predilecta</label>
                          <select
                            className="form-text-input"
                            value={profile.favoriteSystem}
                            onChange={(e) => setProfile(p => ({ ...p, favoriteSystem: e.target.value }))}
                          >
                            <option value="n64">Nintendo 64</option>
                            <option value="snes">Super Nintendo (SNES)</option>
                            <option value="gba">Game Boy Advance</option>
                            <option value="ps1">PlayStation 1</option>
                            <option value="genesis">Sega Genesis / Mega Drive</option>
                            <option value="nes">Nintendo NES</option>
                            <option value="arcade">Arcade MAME</option>
                          </select>
                        </div>

                        <div className="form-field-group">
                          <label className="form-label">Descripción Personal (Bio)</label>
                          <textarea
                            className="form-text-input form-text-area"
                            value={profile.bio}
                            maxLength={350}
                            placeholder="Comparte tus gustos y juegos retro favoritos..."
                            onChange={(e) => setProfile(p => ({ ...p, bio: e.target.value }))}
                          />
                          <span style={{ fontSize: '11px', color: 'var(--text-dim)', textAlign: 'right' }}>
                            {(profile.bio || '').length} / 350
                          </span>
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {/* ========================================================
                    PESTAÑA 4: LOGROS E INSIGNIAS RETRO
                    ======================================================== */}
                {activeTab === 'logros' && (
                  <div className="retrohub-card">
                    <div className="section-header-row">
                      <div className="section-title-wrap">
                        <div className="section-icon-badge">
                          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                            <circle cx="12" cy="8" r="6"></circle>
                            <polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline>
                          </svg>
                        </div>
                        <div>
                          <h3 className="section-title">Logros & Medallas RetroHub</h3>
                          <p className="section-subtitle">Insignias oficiales por horas jugadas, récords y compatibilidad RetroAchievements</p>
                        </div>
                      </div>
                      <span className="badge-pill badge-honor">
                        ⭐ 0 Desbloqueados
                      </span>
                    </div>

                    <div className="retrohub-empty-state">
                      <div className="empty-state-icon">🏆</div>
                      <div className="empty-state-title">Sin medallas ni trofeos desbloqueados</div>
                      <div className="empty-state-subtitle">Conecta con RetroAchievements o completa objetivos en juegos compatibles para desbloquear insignias reales en tu perfil de RetroHub.</div>
                    </div>
                  </div>
                )}

              </div>
            </main>
          </div>

          {/* MODAL CÓDIGO QR OFICIAL SWITCH */}
          {showQrModal && (
            <div className="switch-qr-backdrop" onClick={() => setShowQrModal(false)}>
              <div className="switch-qr-box" onClick={(e) => e.stopPropagation()}>
                <button className="btn-qr-close" onClick={() => setShowQrModal(false)}>✕</button>

                <h3 style={{ fontFamily: 'var(--font-display)', fontSize: '20px', fontWeight: 800, color: 'var(--text-pure)', marginBottom: '4px' }}>
                  Añadir con Código QR
                </h3>
                <p style={{ fontSize: '13px', color: 'var(--text-muted)' }}>
                  Escanea con la cámara de tu smartphone para añadir a @{profile.username} en RetroHub
                </p>

                <div className="qr-matrix-preview">
                  <svg width="180" height="180" viewBox="0 0 29 29" fill="#0f172a">
                    <rect x="2" y="2" width="7" height="7" rx="1" fill="#0f172a" />
                    <rect x="3" y="3" width="5" height="5" fill="#ffffff" />
                    <rect x="4" y="4" width="3" height="3" fill="#0f172a" />

                    <rect x="20" y="2" width="7" height="7" rx="1" fill="#0f172a" />
                    <rect x="21" y="3" width="5" height="5" fill="#ffffff" />
                    <rect x="22" y="4" width="3" height="3" fill="#0f172a" />

                    <rect x="2" y="20" width="7" height="7" rx="1" fill="#0f172a" />
                    <rect x="3" y="21" width="5" height="5" fill="#ffffff" />
                    <rect x="4" y="22" width="3" height="3" fill="#0f172a" />

                    <rect x="10" y="3" width="2" height="2" />
                    <rect x="14" y="3" width="3" height="2" />
                    <rect x="10" y="7" width="3" height="2" />
                    <rect x="15" y="7" width="2" height="2" />
                    <rect x="11" y="11" width="7" height="2" />
                    <rect x="11" y="15" width="2" height="4" />
                    <rect x="15" y="15" width="3" height="3" />
                    <rect x="19" y="12" width="3" height="2" />
                    <rect x="23" y="12" width="4" height="2" />
                    <rect x="19" y="16" width="2" height="4" />
                    <rect x="23" y="16" width="3" height="2" />
                    <rect x="22" y="20" width="4" height="2" />
                    <rect x="10" y="22" width="4" height="2" />
                    <rect x="16" y="23" width="3" height="2" />
                  </svg>
                </div>

                <div style={{ fontFamily: 'var(--font-display)', fontWeight: 800, fontSize: '16px', color: 'var(--text-pure)' }}>
                  {profile.friendCode}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('profileRoot'));
    root.render(<RetroHubProfileApp />);
  </script>
</body>
</html>
