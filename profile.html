  <script type="text/babel">

          return (

              <circle cx="17.5" cy="10.5" r=".5" fill="currentColor"></circle>
              <circle cx="8.5" cy="7.5" r=".5" fill="currentColor"></circle>
              <circle cx="6.5" cy="12.5" r=".5" fill="currentColor"></circle>
              <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"></path>
            </svg>
          );
        case 'image':
          return (
            <svg viewBox="0 0 24 24" width={size} height={size} fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="3" ry="3"></rect>
              <circle cx="8.5" cy="8.5" r="1.5"></circle>
              <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
          );
        case 'link':
          return (
            <svg viewBox="0 0 24 24" width={size} height={size} fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
            </svg>
          );
        case 'plus':
          return (
            <svg viewBox="0 0 24 24" width={size} height={size} fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round">

    }

    // Limpia cualquier emoji heredado de textos guardados en BD o localStorage
    function stripEmojis(text) {
      if (!text) return '';
      return String(text)
        .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu, '')
        .trim();
    }

    const AURA_THEMES = {
      aqua: { id: 'aqua', name: 'Aqua Aero', color: '#00a2ed', glow: 'rgba(0, 162, 237, 0.25)' },
      scarlet: { id: 'scarlet', name: 'Rojo Switch', color: '#e60012', glow: 'rgba(230, 0, 18, 0.25)' },
      emerald: { id: 'emerald', name: 'Menta Cristal', color: '#00d2be', glow: 'rgba(0, 210, 190, 0.25)' },
      violet: { id: 'violet', name: 'Cielo Violeta', color: '#8b5cf6', glow: 'rgba(139, 92, 246, 0.25)' },
      gold: { id: 'gold', name: 'Sol Dorado', color: '#f59e0b', glow: 'rgba(245, 158, 11, 0.25)' }
    };

    const CONSOLE_NAMES = {
      n64: 'Nintendo 64',
      snes: 'Super Nintendo',
      gba: 'Game Boy Advance',
      ps1: 'PlayStation 1',
      nds: 'Nintendo DS',
      genesis: 'Sega Mega Drive',
      nes: 'Nintendo NES'
    };

    const HONOR_TITLES = [
      'Maestro de los 64-Bits',
      'Coleccionista de Cajas Originales',
      'Leyenda de la Plaza RetroHub',
      'Campeón Speedrun Retro',
      'Arquitecto del Multiverso'
    ];

    function generateFriendCode(seed) {
      let hash = 0;
      const str = String(seed || 'himawari');
      for (let i = 0; i < str.length; i++) {
        hash = (hash << 5) - hash + str.charCodeAt(i);
        hash |= 0;
      }
      const abs = Math.abs(hash);
      const p1 = String((abs % 9000) + 1000);
      const p2 = String(((abs * 7) % 9000) + 1000);
      const p3 = String(((abs * 13) % 9000) + 1000);
      return `SW-${p1}-${p2}-${p3}`;
    }

    function formatMinutes(mins) {
      const m = Number(mins) || 0;
      if (m < 60) return `${m} min jugados`;
      const h = Math.floor(m / 60);
      const rem = m % 60;
      return rem > 0 ? `${h} h ${rem} min` : `${h} horas`;
    }

    function RetroHubProfileApp() {
      const currentStoredUser = localStorage.getItem('retrohub_user_name') || 'himawari';
      const initialRole = localStorage.getItem('retrohub_user_role') || (currentStoredUser.toLowerCase() === 'sariwiiwi' ? 'admin' : 'user');

      const [activeTab, setActiveTab] = useState('overview');
      const [profile, setProfile] = useState({
        id: currentStoredUser.toLowerCase() === 'sariwiiwi' ? 2 : 8,
        username: currentStoredUser,
        displayName: localStorage.getItem('retrohub_display_name') || currentStoredUser,
        role: initialRole,
        bio: 'Coleccionista de joyas en caja original y entusiasta de los 60 FPS.',
        avatarUrl: localStorage.getItem('retrohub_user_avatar') || `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(currentStoredUser)}`,
        bannerUrl: 'assets/game_wallpapers/n64/sm64.png',
        titleHonor: 'Maestro de los 64-Bits',
        systemAura: currentStoredUser.toLowerCase() === 'sariwiiwi' ? 'scarlet' : 'aqua',
        favoriteSystem: 'n64',
        presence: { status: 'online', emulator: null, game: null }
      });

      const [playActivity, setPlayActivity] = useState([]);
      const [friends, setFriends] = useState([]);
      const [groups, setGroups] = useState([]);
      const [stockAssets, setStockAssets] = useState({ avatars: [], banners: [] });
      const [copiedCode, setCopiedCode] = useState(false);
      const [showQrModal, setShowQrModal] = useState(false);

      // Estado del Estudio de Personalización
      const [editDisplayName, setEditDisplayName] = useState('');
      const [editUsername, setEditUsername] = useState('');
      const [editBio, setEditBio] = useState('');
      const [editTitleHonor, setEditTitleHonor] = useState('');
      const [editFavSystem, setEditFavSystem] = useState('n64');
      const [editAura, setEditAura] = useState('aqua');
      const [editAvatar, setEditAvatar] = useState('');
      const [editBanner, setEditBanner] = useState('');
      const [saveBannerMsg, setSaveBannerMsg] = useState(null);
      const [isSaving, setIsSaving] = useState(false);

      const friendCode = useMemo(() => generateFriendCode(profile.username), [profile.username]);

      // Cargar perfil autenticado real, amigos y grupos desde SQLite
      useEffect(() => {
        const token = localStorage.getItem('retrohub_jwt_token');
        const storedUser = localStorage.getItem('retrohub_user_name');
        const headers = {};
        let url = '/api/users/profile';

        if (token) {
          headers['Authorization'] = `Bearer ${token}`;
        } else if (storedUser) {
          url = `/api/users/profile/${encodeURIComponent(storedUser.trim().toLowerCase())}`;
        }

        fetch(url, { headers })
          .then((r) => r.json())
          .then((data) => {
            if (data && data.success && data.user) {
              const u = data.user;
              const cleanHonor = stripEmojis(u.titleHonor) || 'Maestro de los 64-Bits';
              const nextRole = u.role || (u.username && u.username.toLowerCase() === 'sariwiiwi' ? 'admin' : 'user');
              const nextProfile = {
                id: u.id,
                username: u.username || currentStoredUser,
                displayName: u.displayName || u.username || currentStoredUser,
                role: nextRole,
                bio: stripEmojis(u.bio) || 'Explorador del multiverso retro en RetroHub.',
                avatarUrl: u.avatarUrl || `https://api.dicebear.com/7.x/bottts/svg?seed=${u.username}`,
                bannerUrl: u.bannerUrl || 'assets/game_wallpapers/n64/sm64.png',
                titleHonor: cleanHonor,
                systemAura: u.systemAura || 'aqua',
                favoriteSystem: u.favoriteSystem || 'n64',
                presence: u.presence || { status: 'online' }
              };
              setProfile(nextProfile);
              setEditDisplayName(nextProfile.displayName);
              setEditUsername(nextProfile.username);
              setEditBio(nextProfile.bio);
              setEditTitleHonor(nextProfile.titleHonor);
              setEditFavSystem(nextProfile.favoriteSystem);
              setEditAura(nextProfile.systemAura in AURA_THEMES ? nextProfile.systemAura : 'aqua');
              setEditAvatar(nextProfile.avatarUrl);
              setEditBanner(nextProfile.bannerUrl);

              localStorage.setItem('retrohub_user_name', nextProfile.username);
              localStorage.setItem('retrohub_display_name', nextProfile.displayName);
              localStorage.setItem('retrohub_user_avatar', nextProfile.avatarUrl);
              localStorage.setItem('retrohub_user_role', nextRole);
              if (window.RetroHubToolbar) {
                window.RetroHubToolbar.updateUser(nextProfile);
              }
            }
          })
          .catch(() => {});

        // Cargar amigos y grupos reales desde /api/chat/overview
        fetch('/api/chat/overview', { headers })
          .then((r) => r.json())
          .then((data) => {
            if (data && data.success) {
              setFriends(data.friends || []);
              setGroups(data.groups || []);
            }
          })
          .catch(() => {});

        window.onRetroHubChatSync = (chatState) => {
          if (chatState) {
            setFriends([...(chatState.friends || [])]);
            setGroups([...(chatState.groups || [])]);
          }
        };

        // Cargar galería de avatares y banners
        fetch('/api/assets/stock-images')
          .then((r) => r.json())
          .then((data) => {
            if (data && data.success) {
              setStockAssets({
                avatars: data.avatars || [],
                banners: data.banners || []
              });
            }
          })
          .catch(() => {});

        // Cargar actividad de juego real
        try {
          const rawAct = JSON.parse(localStorage.getItem('retrohub_play_activity') || '[]');
          if (Array.isArray(rawAct)) setPlayActivity(rawAct);
        } catch (e) {
          setPlayActivity([]);
        }
      }, []);

      // Aplicar color de aura
      useEffect(() => {
        const theme = AURA_THEMES[profile.systemAura] || AURA_THEMES.aqua;
        document.documentElement.style.setProperty('--system-accent', theme.color);
        document.documentElement.style.setProperty('--system-glow', theme.glow);
      }, [profile.systemAura]);

      function handleCopyFriendCode() {
        navigator.clipboard.writeText(friendCode).then(() => {
          setCopiedCode(true);
          setTimeout(() => setCopiedCode(false), 2200);
        });
      }

      function handleFileUpload(e, type) {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (ev) => {
          const base64 = ev.target.result;
          try {
            const res = await fetch('/api/users/upload', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ image: base64, type: type === 'avatar' ? 'pfp' : 'banner' })
            });
            const data = await res.json();
            const finalUrl = data && data.success && data.url ? data.url : base64;
            if (type === 'avatar') setEditAvatar(finalUrl);
            else setEditBanner(finalUrl);
          } catch {
            if (type === 'avatar') setEditAvatar(base64);
            else setEditBanner(base64);
          }
        };
        reader.readAsDataURL(file);
      }

      async function handleSaveCustomization(e) {
        if (e) e.preventDefault();
        setIsSaving(true);
        setSaveBannerMsg(null);

        const token = localStorage.getItem('retrohub_jwt_token');
        const headers = { 'Content-Type': 'application/json' };
        if (token) headers['Authorization'] = `Bearer ${token}`;

        const payload = {
          userId: profile.id,
          username: editUsername.trim() || profile.username,
          displayName: editDisplayName.trim() || profile.displayName,
          bio: stripEmojis(editBio),
          titleHonor: stripEmojis(editTitleHonor),
          favoriteSystem: editFavSystem,
          systemAura: editAura,
          avatarUrl: editAvatar,
          bannerUrl: editBanner
        };

        try {
          const res = await fetch('/api/users/profile', {
            method: 'PUT',
            headers,
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          if (!res.ok || !data.success) {
            throw new Error((data.error && data.error.message) || 'No se pudo guardar el perfil.');
          }

          const updated = {
            ...profile,
            username: data.user.username,
            displayName: data.profile.displayName,
            bio: stripEmojis(data.profile.bio),
            titleHonor: stripEmojis(data.profile.titleHonor),
            favoriteSystem: data.profile.favoriteSystem,
            systemAura: data.profile.systemAura,
            avatarUrl: data.profile.avatarUrl,
            bannerUrl: data.profile.bannerUrl
          };
          setProfile(updated);

          localStorage.setItem('retrohub_user_name', updated.username);
          localStorage.setItem('retrohub_display_name', updated.displayName);
          localStorage.setItem('retrohub_user_avatar', updated.avatarUrl);

          const auraObj = AURA_THEMES[updated.systemAura] || AURA_THEMES.aqua;
          localStorage.setItem('retrohub_aura_color', auraObj.color);
          localStorage.setItem('retrohub_aura_glow', auraObj.glow);

          if (window.RetroHubToolbar) {
            window.RetroHubToolbar.updateUser(updated);
          }

          if (typeof BroadcastChannel !== 'undefined') {
            const ch = new BroadcastChannel('retrohub_profile_sync');
            ch.postMessage({
              type: 'PROFILE_UPDATED',
              username: updated.username,
              displayName: updated.displayName,
              avatarUrl: updated.avatarUrl,
              systemAuraColor: auraObj.color,
              systemAuraGlow: auraObj.glow
            });
          }

          setSaveBannerMsg({ type: 'success', text: 'Cambios guardados y sincronizados en RetroHub.' });
        } catch (err) {
          setSaveBannerMsg({ type: 'error', text: err.message });
        } finally {
          setIsSaving(false);
        }
      }

      const unlockedAchievements = useMemo(() => {
        const list = [];
        if (playActivity.length >= 1) {
          list.push({
            id: 'first_boot',
            title: 'Primer Encendido Retro',
            desc: 'Has iniciado tu primera partida en el emulador de RetroHub.',
            color: 'scarlet'
          });
        }
        const totalMins = playActivity.reduce((acc, g) => acc + (Number(g.minutesPlayed) || 0), 0);
        if (totalMins >= 60) {
          list.push({
            id: 'hour_hero',
            title: 'Maratón de 60 Minutos',

                      </select>
                    </div>

                    <div className="aero-field-group">
                      <label className="aero-field-label">Consola Favorita</label>
                      <select
                        className="aero-select"
                        value={editFavSystem}
                        onChange={(e) => setEditFavSystem(e.target.value)}
                      >
                        {Object.entries(CONSOLE_NAMES).map(([id, label]) => (
                          <option key={id} value={id}>{label}</option>
                        ))}
                      </select>
                    </div>
                  </div>

                  <div className="aero-field-group">
                    <label className="aero-field-label">Color de Acento del Sistema</label>
                    <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap' }}>
                      {Object.values(AURA_THEMES).map((aura) => (
                        <button
                          key={aura.id}
                          type="button"
                          className={`aero-gel-btn ${editAura === aura.id ? 'primary' : ''}`}
                          onClick={() => setEditAura(aura.id)}
                        >
                          <span
                            style={{
                              width: '10px',
                              height: '10px',
                              borderRadius: '50%',
                              background: aura.color,
                              border: '1.5px solid #fff'
                            }}
                          />
                          <span>{aura.name}</span>
                        </button>
                      ))}
                    </div>
                  </div>
                </div>

                {/* Columna 2: Avatar y Banner */}
                <div className="aero-glass-card">
                  <div className="aero-card-header">
                    <div className="aero-card-title-group">
                      <div className="aero-card-icon scarlet">
                        <SvgIcon name="image" size={20} />
                      </div>
                      <div>
                        <h2 className="aero-card-title">Avatar y Fondo de Cabecera</h2>
                        <p className="aero-card-subtitle">Elige de la colección oficial o sube tu propia imagen</p>
                      </div>
                    </div>
                    <label className="aero-gel-btn" style={{ cursor: 'pointer' }}>
                      <SvgIcon name="plus" size={14} />
                      <span>Subir Avatar</span>
                      <input
                        type="file"
                        accept="image/*"
                        style={{ display: 'none' }}
                        onChange={(e) => handleFileUpload(e, 'avatar')}
                      />
                    </label>
                  </div>

                  <div className="aero-field-group">
                    <label className="aero-field-label">Avatares de Colección RetroHub</label>
                    <div className="aero-stock-thumbs">
                      {stockAssets.avatars.map((av) => (
                        <div
                          key={av.id}
                          className={`aero-thumb-item ${editAvatar === av.url ? 'selected' : ''}`}
                          onClick={() => setEditAvatar(av.url)}
                          title={av.name}
                        >
                          <img src={av.url} alt={av.name} />
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="aero-field-group">
                    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                      <label className="aero-field-label">Fondos Panorámicos (Banners)</label>
                      <label className="aero-gel-btn" style={{ cursor: 'pointer', padding: '4px 10px', fontSize: '11px' }}>
                        <SvgIcon name="plus" size={12} />
                        <span>Subir Banner</span>
                        <input
                          type="file"
                          accept="image/*"
                          style={{ display: 'none' }}
                          onChange={(e) => handleFileUpload(e, 'banner')}
                        />
                      </label>
                    </div>
                    <div className="aero-banner-thumbs">
                      {stockAssets.banners.map((bn) => (
                        <div
                          key={bn.id}
                          className={`aero-banner-thumb ${editBanner === bn.url ? 'selected' : ''}`}
                          onClick={() => setEditBanner(bn.url)}
                          title={bn.name}
                        >
                          <img src={bn.url} alt={bn.name} />
                        </div>
                      ))}
                    </div>
                  </div>

                  {saveBannerMsg && (
                    <div
                      style={{
                        padding: '10px 14px',
                        borderRadius: '12px',
                        fontSize: '13px',
                        fontWeight: 700,
                        background:
                          saveBannerMsg.type === 'success'
                            ? 'rgba(16, 185, 129, 0.14)'
                            : 'rgba(239, 68, 68, 0.14)',
                        color: saveBannerMsg.type === 'success' ? '#047857' : '#b91c1c',
                        border: `1px solid ${
                          saveBannerMsg.type === 'success'
                            ? 'rgba(16, 185, 129, 0.35)'
                            : 'rgba(239, 68, 68, 0.35)'
                        }`
                      }}
                    >
                      {saveBannerMsg.text}
                    </div>
                  )}

                  <div style={{ marginTop: 'auto', display: 'flex', justifyContent: 'flex-end', gap: '10px' }}>
                    <button type="submit" className="aero-gel-btn primary" disabled={isSaving}>
                      <SvgIcon name="check" size={15} />
                      <span>{isSaving ? 'Guardando...' : 'Guardar Cambios en RetroHub'}</span>
                    </button>
                  </div>
                </div>
              </form>
            )}
          </div>

          {/* Modal QR de Tarjeta de Amigo */}
          {showQrModal && (
            <div className="aero-modal-overlay" onClick={() => setShowQrModal(false)}>
              <div className="aero-qr-dialog" onClick={(e) => e.stopPropagation()}>
                <h3 style={{ margin: '0 0 6px 0', fontFamily: 'Space Grotesk', fontSize: '20px', color: '#0f172a' }}>
                  Tarjeta QR de {profile.displayName}
                </h3>
                <p style={{ margin: '0 0 16px 0', fontSize: '12.5px', color: '#64748b' }}>
                  Comparte tu clave con otros jugadores de RetroHub
                </p>
                <div
                  style={{
                    background: '#f8fafc',
                    padding: '16px',
                    borderRadius: '18px',
                    display: 'inline-block',
                    border: '1.5px solid #e2e8f0'
                  }}
                >
                  <img
                    src={`https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(
                      `retrohub://friend/${profile.username}/${friendCode}`
                    )}`}
                    alt="Código QR"
                    width="180"
                    height="180"
                    style={{ display: 'block', borderRadius: '10px' }}
                  />
                </div>
                <div
                  style={{
                    marginTop: '14px',
                    fontFamily: 'Space Grotesk, monospace',
                    fontSize: '16px',
                    fontWeight: 800,
                    color: '#0284c7'
                  }}
                >
                  {friendCode}
                </div>
                <div style={{ marginTop: '18px' }}>
                  <button type="button" className="aero-gel-btn primary" onClick={() => setShowQrModal(false)}>
                    Cerrar ventana
                  </button>
                </div>
              </div>
            </div>
          )}
        </main>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('profileRoot'));
    root.render(<RetroHubProfileApp />);
  </script>
</body>
</html>
