<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RetroHub • Perfil de Usuario</title>

  <!-- Tipografías Oficiales de RetroHub -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Barra de Herramientas Común de RetroHub + Estilos Wii / Frutiger Aero -->
  <link rel="stylesheet" href="retrohub_toolbar.css">
  <link rel="stylesheet" href="IisuProfile.css">

  <!-- React 18 y Babel Standalone -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="iisu_cursor.js"></script>
</head>
<body class="profile-body">
  <!-- BARRA DE HERRAMIENTAS COMÚN DE LA WEB (Logo a la izquierda, Navegación al centro, Perfil a la derecha) -->
  <div id="retrohubGlobalToolbar"></div>
  <script src="retrohub_toolbar.js"></script>

  <!-- CONTENEDOR RAÍZ DEL PERFIL -->
  <div id="profileRoot"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // PALETAS DE AURA FRUTIGER AERO & WII
    const AURA_PALETTES = {
      electric: { id: 'electric', name: 'Aqua Aero Cyan', color: '#00a2ed', glow: 'rgba(0, 162, 237, 0.42)' },
      mint: { id: 'mint', name: 'Frutiger Mint', color: '#00d2be', glow: 'rgba(0, 210, 190, 0.42)' },
      scarlet: { id: 'scarlet', name: 'Coral Red', color: '#ff3c28', glow: 'rgba(255, 60, 40, 0.42)' },
      neon: { id: 'neon', name: 'Crystal Violet', color: '#818cf8', glow: 'rgba(129, 140, 248, 0.42)' },
      gold: { id: 'gold', name: 'Solar Gold', color: '#f59e0b', glow: 'rgba(245, 158, 11, 0.42)' }
    };

    const CONSOLE_NAMES = {
      n64: 'Nintendo 64',
      snes: 'Super Nintendo (SNES)',
      gba: 'Game Boy Advance',
      ps1: 'PlayStation 1',
      genesis: 'Sega Mega Drive',
      nes: 'Nintendo NES',
      arcade: 'Arcade MAME'
    };

    // AVATARES REALES DE STOCK
    const STOCK_AVATARS = [
      { id: 'av_paper', name: 'Paper Mario', url: 'ROMS/covers/papermario.png', type: 'covers' },
      { id: 'av_3weeks', name: '3 Weeks in Paradise', url: 'ROMS/covers/3weeksinparadise.jpg', type: 'covers' },
      { id: 'av_anguna', name: 'Anguna', url: 'ROMS/covers/anguna_box.png', type: 'covers' },
      { id: 'av_31in1', name: '31-in-1 Real Game', url: 'ROMS/covers/31in1.png', type: 'covers' },
      { id: 'av_3in1', name: '3-in-1 2-P-Pak', url: 'ROMS/covers/3in1.png', type: 'covers' },
      { id: 'av_n64', name: 'Nintendo 64', url: 'assets/consoles_hires/n64.png', type: 'consoles' },
      { id: 'av_gba', name: 'Game Boy Advance', url: 'assets/consoles_hires/gba.png', type: 'consoles' },
      { id: 'av_nes', name: 'NES', url: 'assets/consoles/nes.png', type: 'consoles' },
      { id: 'av_snes', name: 'Super Nintendo', url: 'assets/consoles_hires/snes.png', type: 'consoles' },
      { id: 'av_ps1', name: 'PlayStation 1', url: 'assets/consoles_hires/ps1.png', type: 'consoles' },
      { id: 'av_bot_himawari', name: 'Himawari Bot', url: 'https://api.dicebear.com/7.x/bottts/svg?seed=SaraHimawari', type: 'characters' },
      { id: 'av_bot_retro', name: 'Retro Gamer', url: 'https://api.dicebear.com/7.x/bottts/svg?seed=SaraRetro', type: 'characters' },
      { id: 'av_bot_pixel', name: 'Pixel Hero', url: 'https://api.dicebear.com/7.x/pixel-art/svg?seed=RetroHubHero', type: 'characters' }
    ];

    // BANNERS PANORÁMICOS
    const STOCK_BANNERS = [
      { id: 'bn_paper', name: 'Paper Mario Kingdom (N64)', url: 'assets/game_wallpapers/n64/papermario.png' },
      { id: 'bn_sm64', name: 'Super Mario 64 Castle (N64)', url: 'assets/game_wallpapers/n64/sm64.png' },
      { id: 'bn_oot', name: 'Zelda Ocarina of Time (N64)', url: 'assets/game_wallpapers/n64/oot.png' },
      { id: 'bn_smw', name: 'Super Mario World (SNES)', url: 'assets/game_wallpapers/snes/smw.png' },
      { id: 'bn_emerald', name: 'Pokémon Esmeralda (GBA)', url: 'assets/game_wallpapers/gba/pokemon_emerald.png' },
      { id: 'bn_n64_art', name: 'Nintendo 64 Matrix', url: 'assets/wallpapers/n64.svg' },
      { id: 'bn_gba_art', name: 'Game Boy Advance Indigo', url: 'assets/wallpapers/gba.svg' }
    ];

    function RetroHubAeroProfile() {
      const [activeTab, setActiveTab] = useState(() => {
        const p = new URLSearchParams(window.location.search);
        return p.get('tab') || 'perfil';
      });

      const [profile, setProfile] = useState({
        id: null,
        username: localStorage.getItem('retrohub_user_name') || 'himawari',
        displayName: localStorage.getItem('retrohub_display_name') || localStorage.getItem('retrohub_user_name') || 'himawari',
        bio: localStorage.getItem('retrohub_user_bio') || '',
        avatarUrl: localStorage.getItem('retrohub_user_avatar') || 'https://api.dicebear.com/7.x/bottts/svg?seed=SaraHimawari',
        bannerUrl: localStorage.getItem('retrohub_user_banner') || 'assets/game_wallpapers/n64/papermario.png',
        titleHonor: localStorage.getItem('retrohub_honor_title') || '🎮 Maestro de los 64-Bits',
        systemAura: localStorage.getItem('retrohub_aura_id') || 'electric',
        favoriteSystem: localStorage.getItem('retrohub_fav_system') || 'n64',
        friendCode: '',
        socialLinks: [
          { id: 'l1', platform: 'discord', title: 'Comunidad Discord', url: 'https://discord.gg/retrohub', icon: '💬' }
        ],
        presence: { status: 'online', game: null }
      });

      const [playActivity, setPlayActivity] = useState([]);
      const [friends, setFriends] = useState([]);
      const [addFriendInput, setAddFriendInput] = useState('');
      const [showQrModal, setShowQrModal] = useState(false);
      const [toast, setToast] = useState(null);
      const [avatarTabFilter, setAvatarTabFilter] = useState('covers');
      const [isSaving, setIsSaving] = useState(false);
      const [isOwner, setIsOwner] = useState(true);

      const [usernameInput, setUsernameInput] = useState(profile.username);
      const [usernameValidation, setUsernameValidation] = useState({ status: 'available', message: '✓ Nombre de usuario activo' });

      const debounceTimerRef = useRef(null);
      const fileInputRef = useRef(null);
      const broadcastRef = useRef(null);

      useEffect(() => {
        // 1. Cargar actividad de juego real
        try {
          const storedAct = localStorage.getItem('retrohub_play_activity');
          if (storedAct) {
            const parsed = JSON.parse(storedAct);
            if (Array.isArray(parsed)) setPlayActivity(parsed);
          }
        } catch (e) {
          setPlayActivity([]);
        }

        // 2. Determinar usuario (parámetro ?user= o sesión JWT)
        const params = new URLSearchParams(window.location.search);
        const targetUser = params.get('user') || params.get('username');
        const token = localStorage.getItem('retrohub_jwt_token');

        let fetchUrl = '/api/users/profile';
        const fetchHeaders = {};
        if (token) fetchHeaders['Authorization'] = `Bearer ${token}`;

        if (targetUser) {
          fetchUrl = `/api/users/profile/${encodeURIComponent(targetUser.trim().toLowerCase())}`;
          const currentLogged = localStorage.getItem('retrohub_user_name');
          if (currentLogged && currentLogged.toLowerCase() !== targetUser.trim().toLowerCase()) {
            setIsOwner(false);
          }
        }

        // 3. Consultar perfil real al servidor
        fetch(fetchUrl, { headers: fetchHeaders })
          .then(r => r.json())
          .then(data => {
            if (data.success && data.user) {
              const u = data.user;
              const userId = u.id;

              let fcKey = `retrohub_friend_code_${userId}`;
              let fc = localStorage.getItem(fcKey) || localStorage.getItem('retrohub_friend_code');
              if (!fc || !fc.startsWith('SW-')) {
                const p1 = Math.floor(1000 + Math.random() * 9000);
                const p2 = Math.floor(1000 + Math.random() * 9000);
                const p3 = Math.floor(1000 + Math.random() * 9000);
                fc = `SW-${p1}-${p2}-${p3}`;
                localStorage.setItem(fcKey, fc);
                localStorage.setItem('retrohub_friend_code', fc);
              }

              const newAura = AURA_PALETTES[u.systemAura] ? u.systemAura : 'electric';
              const updatedProfile = {
                id: userId,
                username: u.username || 'himawari',
                displayName: u.displayName || u.username || 'himawari',
                bio: u.bio !== undefined ? u.bio : '',
                avatarUrl: u.avatarUrl || 'https://api.dicebear.com/7.x/bottts/svg?seed=SaraHimawari',
                bannerUrl: u.bannerUrl || 'assets/game_wallpapers/n64/papermario.png',
                titleHonor: u.titleHonor || '🎮 Maestro de los 64-Bits',
                systemAura: newAura,
                favoriteSystem: u.favoriteSystem || 'n64',
                socialLinks: u.socialLinks && u.socialLinks.length ? u.socialLinks : [
                  { id: 'l1', platform: 'discord', title: 'Comunidad Discord', url: 'https://discord.gg/retrohub', icon: '💬' }
                ],
                friendCode: fc,
                presence: u.presence || { status: 'online', game: null }
              };

              setProfile(updatedProfile);
              setUsernameInput(updatedProfile.username);

              const aura = AURA_PALETTES[newAura] || AURA_PALETTES.electric;
              document.documentElement.style.setProperty('--system-aura-color', aura.color);
              document.documentElement.style.setProperty('--system-aura-glow', aura.glow);

              if (!targetUser || targetUser.toLowerCase() === updatedProfile.username.toLowerCase()) {
                localStorage.setItem('retrohub_user_name', updatedProfile.username);
                localStorage.setItem('retrohub_display_name', updatedProfile.displayName);
                localStorage.setItem('retrohub_user_avatar', updatedProfile.avatarUrl);
                localStorage.setItem('retrohub_user_banner', updatedProfile.bannerUrl);
                localStorage.setItem('retrohub_user_bio', updatedProfile.bio);
                localStorage.setItem('retrohub_honor_title', updatedProfile.titleHonor);
                localStorage.setItem('retrohub_aura_id', newAura);
                localStorage.setItem('retrohub_fav_system', updatedProfile.favoriteSystem);
                if (window.RetroHubToolbar) {
                  window.RetroHubToolbar.updateUser(updatedProfile);
                }
              }
            }
          })
          .catch(() => {
            let fc = localStorage.getItem('retrohub_friend_code') || 'SW-4829-1092-4821';
            setProfile(p => ({ ...p, friendCode: fc }));
          });

        if (typeof BroadcastChannel !== 'undefined') {
          broadcastRef.current = new BroadcastChannel('retrohub_profile_sync');
          broadcastRef.current.onmessage = (event) => {
            if (event.data && event.data.type === 'PLAY_ACTIVITY_UPDATED') {
              setPlayActivity(event.data.activity);
            }
          };
        }

        return () => {
          if (broadcastRef.current) broadcastRef.current.close();
        };
      }, []);

      const showToast = (type, message) => {
        setToast({ type, message });
        setTimeout(() => setToast(null), 3500);
      };

      const handleSelectAura = (auraKey) => {
        const aura = AURA_PALETTES[auraKey];
        if (!aura) return;
        setProfile(p => ({ ...p, systemAura: auraKey }));
        document.documentElement.style.setProperty('--system-aura-color', aura.color);
        document.documentElement.style.setProperty('--system-aura-glow', aura.glow);
        localStorage.setItem('retrohub_aura_id', auraKey);
        showToast('info', `Aura cambiada a ${aura.name}.`);
      };

      const handleSelectAvatar = (url) => {
        setProfile(p => ({ ...p, avatarUrl: url }));
        localStorage.setItem('retrohub_user_avatar', url);
        if (window.RetroHubToolbar) window.RetroHubToolbar.updateUser({ avatarUrl: url });
        if (broadcastRef.current) {
          broadcastRef.current.postMessage({ type: 'PROFILE_UPDATED', avatarUrl: url });
        }
        showToast('success', 'Foto de perfil seleccionada.');
      };

      const handleSelectBanner = (url) => {
        setProfile(p => ({ ...p, bannerUrl: url }));
        localStorage.setItem('retrohub_user_banner', url);
        showToast('success', 'Banner panorámico actualizado.');
      };

      const handleFileUpload = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          const base64 = reader.result;
          setProfile(p => ({ ...p, avatarUrl: base64 }));
          localStorage.setItem('retrohub_user_avatar', base64);
          if (window.RetroHubToolbar) window.RetroHubToolbar.updateUser({ avatarUrl: base64 });
          if (broadcastRef.current) {
            broadcastRef.current.postMessage({ type: 'PROFILE_UPDATED', avatarUrl: base64 });
          }
          showToast('success', 'Imagen personalizada cargada.');
        };
        reader.readAsDataURL(file);
      };

      const handleCopyFriendCode = () => {
        if (!profile.friendCode) return;
        navigator.clipboard.writeText(profile.friendCode).then(() => {
          showToast('success', `✓ Clave ${profile.friendCode} copiada al portapapeles`);
        }).catch(() => {
          showToast('info', `Tu clave: ${profile.friendCode}`);
        });
      };

      const handleUsernameChange = (e) => {
        const val = e.target.value;
        setUsernameInput(val);

        if (!val.trim() || val.length < 3 || val.length > 24) {
          setUsernameValidation({ status: 'invalid', message: '⚠ Debe tener entre 3 y 24 caracteres.' });
          return;
        }

        setUsernameValidation({ status: 'checking', message: '⟳ Comprobando disponibilidad...' });
        if (debounceTimerRef.current) clearTimeout(debounceTimerRef.current);
        debounceTimerRef.current = setTimeout(async () => {
          try {
            const res = await fetch(`/api/users/check-username/${encodeURIComponent(val.trim())}?excludeUserId=${profile.id || 0}`);
            const data = await res.json();
            if (data.available) {
              setUsernameValidation({ status: 'available', message: `✓ @${val.trim()} está disponible` });
            } else {
              setUsernameValidation({ status: 'taken', message: '✗ Este nombre ya está en uso' });
            }
          } catch {
            setUsernameValidation({ status: 'available', message: '✓ Formato válido' });
          }
        }, 300);
      };

      const handleAddFriendByCode = (e) => {
        e.preventDefault();
        const code = addFriendInput.trim().toUpperCase();
        if (!code || !code.startsWith('SW-') || code.length < 14) {
          showToast('error', 'Introduce una clave válida (ej: SW-1234-5678-9012).');
          return;
        }
        setAddFriendInput('');
        showToast('success', `✓ Solicitud de amistad enviada a ${code}`);
      };

      const handleSaveProfile = async () => {
        setIsSaving(true);
        const token = localStorage.getItem('retrohub_jwt_token');
        const payload = {
          userId: profile.id,
          username: usernameInput.trim() || profile.username,
          displayName: profile.displayName.trim() || profile.username,
          bio: profile.bio,
          avatarUrl: profile.avatarUrl,
          bannerUrl: profile.bannerUrl,
          titleHonor: profile.titleHonor,
          systemAura: profile.systemAura,
          favoriteSystem: profile.favoriteSystem,
          socialLinks: profile.socialLinks
        };

        const headers = { 'Content-Type': 'application/json' };
        if (token) headers['Authorization'] = `Bearer ${token}`;

        try {
          const res = await fetch('/api/users/profile', {
            method: 'PUT',
            headers,
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          if (res.ok && data.success) {
            setProfile(p => ({
              ...p,
              username: payload.username,
              displayName: payload.displayName
            }));
            localStorage.setItem('retrohub_user_name', payload.username);
            localStorage.setItem('retrohub_display_name', payload.displayName);
            localStorage.setItem('retrohub_user_bio', payload.bio || '');
            localStorage.setItem('retrohub_user_avatar', payload.avatarUrl);
            localStorage.setItem('retrohub_user_banner', payload.bannerUrl);
            localStorage.setItem('retrohub_honor_title', payload.titleHonor);
            localStorage.setItem('retrohub_fav_system', payload.favoriteSystem);

            if (window.RetroHubToolbar) {
              window.RetroHubToolbar.updateUser({
                username: payload.username,
                displayName: payload.displayName,
                avatarUrl: payload.avatarUrl
              });
            }
            if (broadcastRef.current) {
              broadcastRef.current.postMessage({
                type: 'PROFILE_UPDATED',
                displayName: payload.displayName,
                username: payload.username,
                avatarUrl: payload.avatarUrl,
                systemAura: payload.systemAura
              });
            }
            showToast('success', '✓ Perfil guardado y sincronizado en RetroHub');
          } else {
            showToast('error', data.error ? data.error.message : 'No se pudo guardar el perfil.');
          }
        } catch {
          showToast('error', 'Error de conexión con el servidor local.');
        } finally {
          setIsSaving(false);
        }
      };

      const formatPlayTime = (minutes) => {
        if (!minutes || minutes < 60) return 'Jugado recientemente';
        const hours = Math.floor(minutes / 60);
        return `${hours} h registradas`;
      };

      const activeAuraData = AURA_PALETTES[profile.systemAura] || AURA_PALETTES.electric;

      return (
        <>
          <input
            type="file"
            ref={fileInputRef}
            style={{ display: 'none' }}
            accept="image/*"
            onChange={handleFileUpload}
          />

          {/* Orbes Acuáticos Luminosos Frutiger Aero */}
          <div className="aero-ambient-orb aero-orb-1" />
          <div className="aero-ambient-orb aero-orb-2" />
          <div className="aero-ambient-orb aero-orb-3" />

          {/* Notificación Flotante */}
          {toast && (
            <div className="aero-toast">
              <span>{toast.type === 'success' ? '✓' : toast.type === 'error' ? '⚠' : 'ℹ'}</span>
              <span>{toast.message}</span>
            </div>
          )}

          {/* ESCENARIO DE ANCHO FIJO (1280px): CERO DESPLAZAMIENTOS AL CAMBIAR DE PESTAÑA */}
          <main className="aero-profile-stage">

            {/* 1. TARJETA HERO DE IDENTIDAD (ÚNICA Y SIN ELEMENTOS DUPLICADOS) */}
            <section className="aero-hero-card">
              <div
                className="aero-banner-frame"
                onClick={() => isOwner && setActiveTab('ajustes')}
                title={isOwner ? 'Haz clic para personalizar el banner' : ''}
              >
                <img
                  src={profile.bannerUrl}
                  className="aero-banner-img"
                  alt="Banner del perfil"
                  onError={(e) => { e.target.src = 'assets/game_wallpapers/n64/papermario.png'; }}
                />
                <div className="aero-banner-gloss" />
                {isOwner && <span className="aero-banner-hint">✨ Cambiar Banner</span>}
              </div>

              <div className="aero-hero-body">
                <div className="aero-identity-left">
                  <div
                    className="aero-avatar-bubble"
                    onClick={() => isOwner && setActiveTab('ajustes')}
                    title={isOwner ? 'Haz clic para cambiar tu avatar' : ''}
                  >
                    <img
                      src={profile.avatarUrl}
                      className="aero-avatar-img"
                      alt={profile.displayName}
                      onError={(e) => { e.target.src = 'https://api.dicebear.com/7.x/bottts/svg?seed=SaraHimawari'; }}
                    />
                    <span className="aero-online-orb" />
                  </div>

                  <div className="aero-identity-meta">
                    <div className="aero-name-row">
                      <h1 className="aero-display-name">{profile.displayName}</h1>
                      <span className="aero-handle-tag">@{profile.username}</span>
                    </div>

                    <div className="aero-badges-row">
                      <span className="aero-pill-badge honor">{profile.titleHonor}</span>
                      <span className="aero-pill-badge">
                        🕹️ {CONSOLE_NAMES[profile.favoriteSystem] || profile.favoriteSystem.toUpperCase()}
                      </span>
                      {profile.presence && profile.presence.status === 'playing' && profile.presence.game ? (
                        <span className="aero-pill-badge status-playing">
                          🎮 Jugando a {profile.presence.game}
                        </span>
                      ) : (
                        <span className="aero-pill-badge status-online">
                          🟢 En línea
                        </span>
                      )}
                    </div>
                  </div>
                </div>

                {/* Cápsula Única de Clave de Amigo */}
                <div className="aero-friendcode-capsule">
                  <div className="aero-fc-icon">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                      <rect x="2" y="6" width="20" height="12" rx="6"></rect>
                      <line x1="6" y1="12" x2="10" y2="12"></line>
                      <line x1="8" y1="10" x2="8" y2="14"></line>
                      <circle cx="15.5" cy="13.5" r="1.2" fill="currentColor"></circle>
                      <circle cx="18.5" cy="10.5" r="1.2" fill="currentColor"></circle>
                    </svg>
                  </div>
                  <div className="aero-fc-info">
                    <span className="aero-fc-label">Clave de Amigo</span>
                    <span className="aero-fc-code">{profile.friendCode || 'SW-0000-0000-0000'}</span>
                  </div>
                  <div className="aero-fc-actions">
                    <button className="btn-wii-porcelain" onClick={handleCopyFriendCode} title="Copiar clave al portapapeles">
                      Copiar
                    </button>
                    <button className="btn-wii-porcelain" onClick={() => setShowQrModal(true)} title="Mostrar tarjeta QR">
                      QR
                    </button>
                  </div>
                </div>
              </div>
            </section>

            {/* 2. DOCK DE CANALES WII / FRUTIGER AERO (NAVEGACIÓN DE SECCIONES DEL PERFIL) */}
            <nav className="aero-channel-dock" aria-label="Secciones del perfil">
              <button
                className={`aero-tab-btn ${activeTab === 'perfil' ? 'active' : ''}`}
                onClick={() => setActiveTab('perfil')}
              >
                <span>🕹️</span>
                <span>Resumen y Actividad</span>
              </button>

              <button
                className={`aero-tab-btn ${activeTab === 'amigos' ? 'active' : ''}`}
                onClick={() => setActiveTab('amigos')}
              >
                <span>🤝</span>
                <span>Amigos</span>
                <span className="aero-tab-count">{friends.length}</span>
              </button>

              <button
                className={`aero-tab-btn ${activeTab === 'logros' ? 'active' : ''}`}
                onClick={() => setActiveTab('logros')}
              >
                <span>🏆</span>
                <span>Logros</span>
                <span className="aero-tab-count">0</span>
              </button>

              {isOwner && (
                <button
                  className={`aero-tab-btn ${activeTab === 'ajustes' ? 'active' : ''}`}
                  onClick={() => setActiveTab('ajustes')}
                >
                  <span>✨</span>
                  <span>Personalizar Perfil</span>
                </button>
              )}
            </nav>

            {/* 3. VIEWPORT DE CONTENIDO (DIMENSIONES BLOQUEADAS) */}
            <div className="aero-tab-viewport">

              {/* ========================================================
                  PESTAÑA 1: RESUMEN Y ACTIVIDAD DE JUEGO
                  ======================================================== */}
              {activeTab === 'perfil' && (
                <div className="aero-overview-grid">
                  {/* Columna Izquierda: Carta de Presentación & Redes */}
                  <div className="aero-glass-card">
                    <div className="aero-card-header">
                      <div className="aero-card-title-group">
                        <div className="aero-icon-orb">💬</div>
                        <div>
                          <h2 className="aero-card-title">Pasaporte de Jugador</h2>
                          <p className="aero-card-subtitle">Biografía y enlaces de comunidad</p>
                        </div>
                      </div>
                    </div>

                    <div className="aero-bio-box">
                      {profile.bio || 'Sin descripción personal todavía. Puedes personalizar tu biografía desde la pestaña "Personalizar Perfil".'}
                    </div>

                    <div>
                      <span className="aero-label" style={{ display: 'block', marginBottom: '8px' }}>
                        Canales y Redes Vinculadas
                      </span>
                      <div className="aero-social-list">
                        {profile.socialLinks && profile.socialLinks.map(link => (
                          <a
                            key={link.id}
                            href={link.url}
                            target="_blank"
                            rel="noreferrer"
                            className="btn-wii-porcelain"
                          >
                            <span>{link.icon || '🔗'}</span>
                            <span>{link.title}</span>
                            <span style={{ color: '#0284c7', fontSize: '11px' }}>↗</span>
                          </a>
                        ))}
                      </div>
                    </div>
                  </div>

                  {/* Columna Derecha: Canales de Actividad de Juego (Estilo Wii Menu) */}
                  <div className="aero-glass-card">
                    <div className="aero-card-header">
                      <div className="aero-card-title-group">
                        <div className="aero-icon-orb">📺</div>
                        <div>
                          <h2 className="aero-card-title">Canales de Actividad Reciente</h2>
                          <p className="aero-card-subtitle">Títulos iniciados y registro de sesiones en consola</p>
                        </div>
                      </div>
                      <span className="aero-pill-badge">
                        {playActivity.length} {playActivity.length === 1 ? 'título' : 'títulos'}
                      </span>
                    </div>

                    {playActivity && playActivity.length > 0 ? (
                      <div className="wii-channels-grid">
                        {playActivity.map(game => (
                          <div
                            key={game.id || game.title}
                            className="wii-channel-tile"
                            onClick={() => window.location.href = `index.html?launch=${game.id || ''}`}
                            title={`Continuar jugando a ${game.title}`}
                          >
                            <div className="wii-channel-screen">
                              <div className="wii-channel-ambient" style={{ backgroundImage: `url(${game.cover})` }} />
                              <img
                                src={game.cover}
                                className="wii-channel-art"
                                alt={game.title}
                                onError={(e) => { e.target.src = 'assets/consoles_hires/n64.png'; }}
                              />
                              <span className="wii-channel-sys-tag">{(game.system || 'RETRO').toUpperCase()}</span>
                            </div>
                            <div className="wii-channel-meta">
                              <div className="wii-channel-title">{game.title}</div>
                              <div className="wii-channel-time">{formatPlayTime(game.minutesPlayed)}</div>
                              <div className="wii-channel-date">{game.lastPlayed || 'Sesión guardada'}</div>
                            </div>
                          </div>
                        ))}
                      </div>
                    ) : (
                      <div className="aero-empty-channel">
                        <div className="aero-empty-orb">💿</div>
                        <div className="aero-empty-title">Sin actividad de juego registrada</div>
                        <div className="aero-empty-desc">
                          Cuando inicies una ROM desde la sección de Consolas en la barra superior, tus canales jugados y horas aparecerán aquí automáticamente.
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              )}

              {/* ========================================================
                  PESTAÑA 2: LISTA DE AMIGOS
                  ======================================================== */}
              {activeTab === 'amigos' && (
                <div className="aero-glass-card">
                  <div className="aero-card-header">
                    <div className="aero-card-title-group">
                      <div className="aero-icon-orb">🤝</div>
                      <div>
                        <h2 className="aero-card-title">Agenda de Amigos de RetroHub</h2>
                        <p className="aero-card-subtitle">Registra claves de amigo para jugar en red local o P2P</p>
                      </div>
                    </div>
                    <span className="aero-pill-badge status-online">
                      ● {friends.filter(f => f.online).length} en línea
                    </span>
                  </div>

                  <form className="aero-friend-bar" onSubmit={handleAddFriendByCode}>
                    <div className="aero-input-capsule">
                      <span className="aero-sw-prefix">SW-</span>
                      <input
                        type="text"
                        className="aero-input-clean"
                        placeholder="1234-5678-9012 (Introduce la clave de tu amigo)"
                        value={addFriendInput}
                        onChange={(e) => setAddFriendInput(e.target.value)}
                        maxLength={18}
                      />
                    </div>
                    <button type="submit" className="btn-aero-gel">
                      <span>＋ Registrar Amigo</span>
                    </button>
                  </form>

                  {friends && friends.length > 0 ? (
                    <div className="aero-friends-grid">
                      {friends.map(f => (
                        <div key={f.id} className="aero-friend-card">
                          <img src={f.avatar} style={{ width: '44px', height: '44px', borderRadius: '50%' }} alt={f.name} />
                          <div>
                            <div style={{ fontWeight: 800, fontSize: '14px' }}>{f.name}</div>
                            <div style={{ fontSize: '12px', color: '#0284c7' }}>@{f.username}</div>
                          </div>
                        </div>
                      ))}
                    </div>
                  ) : (
                    <div className="aero-empty-channel">
                      <div className="aero-empty-orb">🌐</div>
                      <div className="aero-empty-title">Tu agenda de amigos está vacía</div>
                      <div className="aero-empty-desc">
                        Comparte tu clave personal ({profile.friendCode}) o registra la clave de otro jugador en la barra superior para conectar.
                      </div>
                    </div>
                  )}
                </div>
              )}

              {/* ========================================================
                  PESTAÑA 3: LOGROS Y MEDALLAS
                  ======================================================== */}
              {activeTab === 'logros' && (
                <div className="aero-glass-card">
                  <div className="aero-card-header">
                    <div className="aero-card-title-group">
                      <div className="aero-icon-orb">🏆</div>
                      <div>
                        <h2 className="aero-card-title">Vitrina de Logros & Trofeos</h2>
                        <p className="aero-card-subtitle">Medallas obtenidas en emuladores compatibles con RetroAchievements</p>
                      </div>
                    </div>
                    <span className="aero-pill-badge honor">⭐ 0 Desbloqueados</span>
                  </div>

                  <div className="aero-empty-channel">
                    <div className="aero-empty-orb">🏅</div>
                    <div className="aero-empty-title">Aún no hay trofeos desbloqueados</div>
                    <div className="aero-empty-desc">
                      Completa desafíos y objetivos en tus partidas retro para llenar tu vitrina cristalina de insignias.
                    </div>
                  </div>
                </div>
              )}

              {/* ========================================================
                  PESTAÑA 4: PERSONALIZAR PERFIL (ESTUDIO UNIFICADO)
                  ======================================================== */}
              {activeTab === 'ajustes' && isOwner && (
                <div className="aero-glass-card">
                  <div className="aero-card-header">
                    <div className="aero-card-title-group">
                      <div className="aero-icon-orb">✨</div>
                      <div>
                        <h2 className="aero-card-title">Estudio de Personalización Aero</h2>
                        <p className="aero-card-subtitle">Configura tu identidad, apariencia cristalina y datos públicos</p>
                      </div>
                    </div>

                    <button
                      className="btn-aero-gel"
                      onClick={handleSaveProfile}
                      disabled={isSaving}
                    >
                      <span>{isSaving ? 'Guardando...' : '✓ Guardar Cambios'}</span>
                    </button>
                  </div>

                  <div className="aero-studio-grid">
                    {/* Columna Izquierda: Apariencia Visual (Aura, Avatar, Banner) */}
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>

                      {/* Selector de Aura */}
                      <div className="aero-subpanel">
                        <label className="aero-label">Color de Aura & Cristal ({activeAuraData.name})</label>
                        <div className="aero-aura-row">
                          {Object.values(AURA_PALETTES).map(aura => (
                            <div
                              key={aura.id}
                              className={`aero-aura-orb ${profile.systemAura === aura.id ? 'active' : ''}`}
                              style={{ background: aura.color, color: aura.color }}
                              onClick={() => handleSelectAura(aura.id)}
                              title={aura.name}
                            />
                          ))}
                        </div>
                      </div>

                      {/* Selector de Avatar */}
                      <div className="aero-subpanel">
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                          <label className="aero-label">Imagen de Avatar</label>
                          <button
                            type="button"
                            className="btn-wii-porcelain"
                            onClick={() => fileInputRef.current?.click()}
                          >
                            📁 Subir Foto
                          </button>
                        </div>

                        <div className="aero-Segmented-pills">
                          <button
                            type="button"
                            className={`aero-seg-btn ${avatarTabFilter === 'covers' ? 'active' : ''}`}
                            onClick={() => setAvatarTabFilter('covers')}
                          >
                            Juegos
                          </button>
                          <button
                            type="button"
                            className={`aero-seg-btn ${avatarTabFilter === 'consoles' ? 'active' : ''}`}
                            onClick={() => setAvatarTabFilter('consoles')}
                          >
                            Consolas
                          </button>
                          <button
                            type="button"
                            className={`aero-seg-btn ${avatarTabFilter === 'characters' ? 'active' : ''}`}
                            onClick={() => setAvatarTabFilter('characters')}
                          >
                            Personajes
                          </button>
                        </div>

                        <div className="aero-avatar-grid">
                          {STOCK_AVATARS.filter(a => a.type === avatarTabFilter).map(item => (
                            <div
                              key={item.id}
                              className={`aero-avatar-choice ${profile.avatarUrl === item.url ? 'active' : ''}`}
                              onClick={() => handleSelectAvatar(item.url)}
                              title={item.name}
                            >
                              <img src={item.url} alt={item.name} />
                            </div>
                          ))}
                        </div>
                      </div>

                      {/* Selector de Banner */}
                      <div className="aero-subpanel">
                        <label className="aero-label">Fondo Panorámico del Perfil</label>
                        <div className="aero-banner-grid">
                          {STOCK_BANNERS.map(b => (
                            <div
                              key={b.id}
                              className={`aero-banner-choice ${profile.bannerUrl === b.url ? 'active' : ''}`}
                              onClick={() => handleSelectBanner(b.url)}
                              title={b.name}
                            >
                              <img src={b.url} alt={b.name} />
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>

                    {/* Columna Derecha: Datos de la Cuenta */}
                    <div className="aero-subpanel">
                      <div className="aero-field-group">
                        <label className="aero-label">Identificador Único (@usuario)</label>
                        <input
                          type="text"
                          className="aero-input"
                          value={usernameInput}
                          maxLength={24}
                          onChange={handleUsernameChange}
                        />
                        <span style={{ fontSize: '11.5px', fontWeight: 700, color: usernameValidation.status === 'taken' || usernameValidation.status === 'invalid' ? '#e11d48' : '#0284c7' }}>
                          {usernameValidation.message}
                        </span>
                      </div>

                      <div className="aero-field-group">
                        <label className="aero-label">Nombre Visible</label>
                        <input
                          type="text"
                          className="aero-input"
                          value={profile.displayName}
                          maxLength={32}
                          onChange={(e) => setProfile(p => ({ ...p, displayName: e.target.value }))}
                        />
                      </div>

                      <div className="aero-field-group">
                        <label className="aero-label">Título Honorífico</label>
                        <input
                          type="text"
                          className="aero-input"
                          value={profile.titleHonor}
                          maxLength={40}
                          onChange={(e) => setProfile(p => ({ ...p, titleHonor: e.target.value }))}
                        />
                      </div>

                      <div className="aero-field-group">
                        <label className="aero-label">Consola Favorita</label>
                        <select
                          className="aero-input"
                          value={profile.favoriteSystem}
                          onChange={(e) => setProfile(p => ({ ...p, favoriteSystem: e.target.value }))}
                        >
                          <option value="n64">Nintendo 64</option>
                          <option value="snes">Super Nintendo (SNES)</option>
                          <option value="gba">Game Boy Advance</option>
                          <option value="ps1">PlayStation 1</option>
                          <option value="genesis">Sega Mega Drive</option>
                          <option value="nes">Nintendo NES</option>
                          <option value="arcade">Arcade MAME</option>
                        </select>
                      </div>

                      <div className="aero-field-group" style={{ marginBottom: 0 }}>
                        <label className="aero-label">Biografía Personal</label>
                        <textarea
                          className="aero-input aero-textarea"
                          value={profile.bio}
                          maxLength={350}
                          placeholder="Escribe sobre tus consolas y juegos favoritos..."
                          onChange={(e) => setProfile(p => ({ ...p, bio: e.target.value }))}
                        />
                        <span style={{ fontSize: '11px', color: 'var(--text-dim)', textAlign: 'right' }}>
                          {(profile.bio || '').length} / 350
                        </span>
                      </div>
                    </div>
                  </div>
                </div>
              )}

            </div>
          </main>

          {/* MODAL TARJETA QR */}
          {showQrModal && (
            <div className="aero-modal-backdrop" onClick={() => setShowQrModal(false)}>
              <div className="aero-modal-box" onClick={(e) => e.stopPropagation()}>
                <button className="aero-modal-close" onClick={() => setShowQrModal(false)}>✕</button>
                <h3 style={{ fontFamily: 'var(--font-display)', fontSize: '20px', fontWeight: 800, color: 'var(--text-pure)' }}>
                  Tarjeta QR de Jugador
                </h3>
                <p style={{ fontSize: '13px', color: 'var(--text-muted)', marginTop: '4px' }}>
                  Comparte este código para añadir a @{profile.username} en RetroHub
                </p>

                <div className="aero-qr-frame">
                  <svg width="175" height="175" viewBox="0 0 29 29" fill="#0f172a">
                    <rect x="2" y="2" width="7" height="7" rx="1" fill="#0f172a" />
                    <rect x="3" y="3" width="5" height="5" fill="#ffffff" />
                    <rect x="4" y="4" width="3" height="3" fill="#00a2ed" />
                    <rect x="20" y="2" width="7" height="7" rx="1" fill="#0f172a" />
                    <rect x="21" y="3" width="5" height="5" fill="#ffffff" />
                    <rect x="22" y="4" width="3" height="3" fill="#00a2ed" />
                    <rect x="2" y="20" width="7" height="7" rx="1" fill="#0f172a" />
                    <rect x="3" y="21" width="5" height="5" fill="#ffffff" />
                    <rect x="4" y="22" width="3" height="3" fill="#00a2ed" />
                    <rect x="10" y="3" width="2" height="2" />
                    <rect x="14" y="3" width="3" height="2" />
                    <rect x="10" y="7" width="3" height="2" />
                    <rect x="15" y="7" width="2" height="2" />
                    <rect x="11" y="11" width="7" height="2" />
                    <rect x="11" y="15" width="2" height="4" />
                    <rect x="15" y="15" width="3" height="3" />
                    <rect x="19" y="12" width="3" height="2" />
                    <rect x="23" y="12" width="4" height="2" />
                    <rect x="19" y="16" width="2" height="4" />
                    <rect x="23" y="16" width="3" height="2" />
                    <rect x="22" y="20" width="4" height="2" />
                    <rect x="10" y="22" width="4" height="2" />
                    <rect x="16" y="23" width="3" height="2" />
                  </svg>
                </div>

                <div style={{ fontFamily: 'var(--font-display)', fontWeight: 800, fontSize: '16px', color: '#0284c7' }}>
                  {profile.friendCode}
                </div>
              </div>
            </div>
          )}
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('profileRoot'));
    root.render(<RetroHubAeroProfile />);
  </script>
</body>
</html>
